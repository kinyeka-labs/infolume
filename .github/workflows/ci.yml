name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Restoring the test project pulls in the app project through its reference,
      # so both are covered by one call.
      - name: Restore
        run: dotnet restore tests/Infolume.Tests/Infolume.Tests.csproj

      # app.ico is generated by build.ps1 from the app's own painter and is not
      # committed, so the compile is told not to embed it. It is a shell resource
      # only - nothing under test reads it.
      - name: Build
        run: dotnet build tests/Infolume.Tests/Infolume.Tests.csproj -c Release --no-restore -p:ApplicationIcon=

      - name: Test
        run: dotnet test tests/Infolume.Tests/Infolume.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

# Deliberately not run here: build.ps1's --selftest stage. It launches the real
# tray app and asserts on its trace log, which needs an interactive desktop
# session, a taskbar to place an icon in and at least one audio endpoint. A
# hosted runner has none of the three, so it would fail for reasons that say
# nothing about the change under test. It stays a local pre-release gate.
